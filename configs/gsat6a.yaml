  mechanism: Induced jitter from bearing vibration
- source: gyro_drift
  target: gyro_bias_observed
  weight: 0.95
  mechanism: Direct estimation of bias by flight software
- source: gyro_drift
  target: pointing_accuracy
  weight: 0.8
  mechanism: Controller corrects for fake bias, inducing real pointing error
- source: magnetorquer_anomaly
  target: control_effort
  weight: 0.8
  mechanism: Loss of magnetic desaturation capability
- source: control_effort
  target: wheel_speed_measured
  weight: 0.9
  mechanism: Saturated momentum must be stored in wheels
- source: pointing_accuracy
  target: pointing_error_measured
  weight: 1.0
  mechanism: Telemetry reports actual deviation
- source: transponder_fault
  target: link_quality
  weight: 0.85
  mechanism: Reduced HPA gain lowers total SNR
- source: transponder_fault
  target: transponder_temp_measured
  weight: 0.7
  mechanism: Inefficient HPA generates more waste heat
